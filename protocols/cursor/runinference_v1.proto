    InferenceTextStreamPart text_part = 1;
    InferenceToolCallStreamPart tool_call_part = 2;
    InferenceUsageInfo usage = 3;
    InferenceResponseInfo response_info = 4;
    InferenceExtendedUsageInfo extended_usage = 5;
    InferenceProviderMetadataInfo provider_metadata = 6;
    InferenceInvocationIdInfo invocation_id = 7;
    InferenceStreamError error = 8;
    InferenceThinkingStreamPart thinking_part = 9;
    InferenceImageDescriptionsInfo image_descriptions = 10;
    InferenceLineageTagsInfo lineage_tags = 11;
  }
}
message RunInferenceInvocationResponse {
  string invocation_id = 1;
  InferenceStreamResponse response = 2;
}
message RunInferenceErrorDetail {
  string type = 1;
  bytes value = 2;
}
enum RunInferenceInvocationRefusal {
  RUN_INFERENCE_INVOCATION_REFUSAL_UNSPECIFIED = 0;
  RUN_INFERENCE_INVOCATION_REFUSAL_CONFIG_MISMATCH = 1;
}
message RunInferenceInvocationError {
  int32 code = 1;
  string message = 2;
  repeated RunInferenceErrorDetail details = 3;
  RunInferenceInvocationRefusal refusal = 4;
}
enum RunInferenceDeltaRefusal {
  RUN_INFERENCE_DELTA_REFUSAL_UNSPECIFIED = 0;
  RUN_INFERENCE_DELTA_REFUSAL_BASE_UNKNOWN = 1;
  RUN_INFERENCE_DELTA_REFUSAL_BASE_TOO_SHORT = 2;
  RUN_INFERENCE_DELTA_REFUSAL_PREFIX_MISMATCH = 3;
  RUN_INFERENCE_DELTA_REFUSAL_REQUEST_MISMATCH = 4;
  RUN_INFERENCE_DELTA_REFUSAL_NOT_ACCEPTED = 5;
}
message RunInferenceInvocationEnd {
  string invocation_id = 1;
  optional RunInferenceInvocationError error = 2;
  optional RunInferenceDeltaRefusal delta_refused = 3;
}
message RunInferenceResolvedSubagentModel {
  string requested = 1;
  optional string resolved_slug = 2;
  optional RunInferenceSubagentModelPolicy policy = 3;
}
message RunInferenceSubagentModelsResolved {
  string resolution_id = 1;
  repeated RunInferenceResolvedSubagentModel models = 2;
}
message RunInferenceServerMessage {
  oneof message {
    RunInferenceHeartbeat heartbeat = 1;
    RunInferenceRunReady run_ready = 2;
    RunInferenceInvocationResponse invocation_response = 3;
    RunInferenceInvocationEnd invocation_end = 4;
    RunInferenceSubagentModelsResolved subagent_models_resolved = 5;
  }
}
message BidiRequestId {
  string request_id = 1;
}

// agent.v1.AgentWebSocket* — the run WebSocket framing spoken on
// wss://api2.cursor.sh/agent/v1/run (subprotocol cursor-run-inference-preconnect-v1),
// extracted from cursor-always-local dist/254.js.
enum AgentWebSocketProtocolVersion {
  AGENT_WEB_SOCKET_PROTOCOL_VERSION_UNSPECIFIED = 0;
  AGENT_WEB_SOCKET_PROTOCOL_VERSION_V1 = 1;
}
message AgentWebSocketHello {
  AgentWebSocketProtocolVersion protocol_version = 1;
}
message AgentWebSocketRunIdentity {
  string run_id = 1;
  string request_id = 2;
}
message AgentWebSocketHeader {
  string name = 1;
  string value = 2;
}
message AgentWebSocketRunStart {
  AgentWebSocketRunIdentity identity = 1;
  repeated AgentWebSocketHeader headers = 2;
}
message AgentWebSocketClientMessage {
  string run_id = 1;
  uint64 sequence = 2;
  bytes message = 3;
}
message AgentWebSocketClientHalfClose {
  string run_id = 1;
}
message AgentWebSocketCancelRun {
  string run_id = 1;
}
message AgentWebSocketClientFrame {
  oneof frame {
    AgentWebSocketHello hello = 1;
    AgentWebSocketRunStart run_start = 2;
    AgentWebSocketClientMessage client_message = 3;
    AgentWebSocketClientHalfClose half_close = 4;
    AgentWebSocketCancelRun cancel_run = 5;
  }
}
message AgentWebSocketRunAccepted {
  AgentWebSocketRunIdentity identity = 1;
  repeated AgentWebSocketHeader headers = 2;
}
message AgentWebSocketServerMessage {
  string run_id = 1;
  uint64 sequence = 2;
  bytes message = 3;
}
message AgentWebSocketRunEnd {
  AgentWebSocketRunIdentity identity = 1;
  repeated AgentWebSocketHeader trailers = 2;
}
message AgentWebSocketServerFrame {
  oneof frame {
    AgentWebSocketHello hello = 1;
    AgentWebSocketRunAccepted run_accepted = 2;
    AgentWebSocketServerMessage server_message = 3;
    AgentWebSocketRunEnd run_end = 4;
  }
}
