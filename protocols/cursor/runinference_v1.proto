message InferenceFirstOutputTiming {
  double provider_ttft_ms = 1;
  double server_first_output_ms = 2;
  double server_dispatch_ms = 3;
}
message InferenceStreamResponse {
  InferenceFirstOutputTiming first_output_timing = 12;
