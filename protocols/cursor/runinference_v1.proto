message RunInferenceBackgroundSummarizationConfig {
  optional int32 unused_tokens_threshold_to_start = 1;
  optional double unused_percent_tokens_threshold_to_start = 2;
  optional int32 unused_tokens_threshold_to_persist = 3;
  optional double unused_percent_tokens_threshold_to_persist = 4;
  bool require_trigger_threshold_for_mid_loop_persist = 5;
  bool discard_on_error = 6;
}
message RunInferenceSummarizationConfig {
  InferenceRequestedModel model = 1;
  bool is_fallback_to_main_model = 2;
  int32 max_prompt_chars = 3;
  RunInferenceBackgroundSummarizationConfig background = 4;
}
message CursorRuleTypeFileGlobs {
  repeated string globs = 1;
}
message CursorRuleTypeAgentFetched {
  string description = 1;
}
message CursorRuleType {
  oneof type {
    bytes global = 1;
    CursorRuleTypeFileGlobs file_globbed = 2;
    CursorRuleTypeAgentFetched agent_fetched = 3;
    bytes manually_attached = 4;
  }
}
enum CursorRuleSource {
  CURSOR_RULE_SOURCE_UNSPECIFIED = 0;
  CURSOR_RULE_SOURCE_TEAM = 1;
  CURSOR_RULE_SOURCE_USER = 2;
}
message CursorRule {
  string full_path = 1;
  string content = 2;
